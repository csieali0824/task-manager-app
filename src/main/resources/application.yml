server:
  port: 8080

spring:
  application:
    name: task-manager-app
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    mcp:
      server:
        name: task-manager
        version: 0.0.1
        # Streamable HTTP transport (MCP SDK 0.13.1): more robust reconnect and version
        # negotiation than the older SSE transport. Clients connect to http://localhost:8081/mcp
        protocol: STREAMABLE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs